services:
  adagio-front:
    container_name: adagio-front
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - .env

    environment:
      NODE_ENV: production

    networks:
      - adagio-network


networks:
  adagio-network:
    driver: bridge