<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; background: #090909; }
  * { box-sizing: border-box; }
  ::selection { background: #F3F3F3; color: #090909; }
  input::placeholder { color: #666666; }
  @keyframes driftOne { 0%, 100% { transform: translate(-10%, -10%) scale(1); } 50% { transform: translate(6%, 4%) scale(1.15); } }
  @keyframes driftTwo { 0%, 100% { transform: translate(8%, 6%) scale(1.1); } 50% { transform: translate(-6%, -8%) scale(1); } }
  @keyframes cardIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
</style>
</helmet>
<div data-screen-label="Login" dir="rtl" lang="fa" style="position: relative; background: #090909; color: #FFFFFF; font-family: 'Vazirmatn', -apple-system, 'Helvetica Neue', Arial, sans-serif; min-height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 24px;">

  <div style="position: absolute; top: -20%; right: -15%; width: 60vw; height: 60vw; max-width: 700px; max-height: 700px; border-radius: 50%; background: radial-gradient(circle, rgba(168,168,168,0.10), transparent 70%); filter: blur(40px); animation: driftOne 22s ease-in-out infinite;"></div>
  <div style="position: absolute; bottom: -20%; left: -15%; width: 55vw; height: 55vw; max-width: 640px; max-height: 640px; border-radius: 50%; background: radial-gradient(circle, rgba(243,243,243,0.06), transparent 70%); filter: blur(40px); animation: driftTwo 26s ease-in-out infinite;"></div>
  <div style="position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 3px 3px; opacity: 0.6; pointer-events: none;"></div>

  <a href="Home.dc.html" style="position: absolute; top: clamp(20px,4vw,40px); right: clamp(20px,4vw,40px); font-family: 'Instrument Serif', serif; font-style: italic; font-size: 22px; color: #F3F3F3; text-decoration: none; z-index: 2; direction: ltr;">Adagio</a>

  <div style="position: relative; z-index: 1; width: 100%; max-width: 420px; background: rgba(24,24,24,0.55); backdrop-filter: blur(28px); border: 1px solid rgba(255,255,255,0.08); border-radius: 28px; padding: clamp(32px, 5vw, 48px); box-shadow: 0 30px 80px rgba(0,0,0,0.5); animation: cardIn 0.7s cubic-bezier(.16,.8,.24,1);">

    <div style="text-align: center; margin-bottom: 36px;">
      <p style="font-size: 11px; letter-spacing: 1px; color: #A8A8A8; margin: 0 0 16px;">نسخه ۰۱ — اعضا</p>
      <h1 style="font-family: 'Vazirmatn', sans-serif; font-weight: 900; font-size: clamp(26px, 4vw, 34px); color: #F3F3F3; margin: 0;">{{ headline }}</h1>
    </div>

    <form onSubmit="{{ onSubmit }}">
      <div style="margin-bottom: 18px;">
        <label style="display: block; font-size: 12px; color: #A8A8A8; margin-bottom: 8px;">ایمیل</label>
        <input type="email" value="{{ email }}" onChange="{{ onEmailChange }}" placeholder="you@example.com" required="{{ true }}" style="width: 100%; background: #181818; border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 15px 18px; color: #F3F3F3; font-size: 15px; outline: none; transition: border-color 0.25s ease; text-align: right; direction: ltr;" style-focus="border-color: rgba(243,243,243,0.5);"/>
      </div>

      <div style="margin-bottom: 18px;">
        <label style="display: block; font-size: 12px; color: #A8A8A8; margin-bottom: 8px;">رمز عبور</label>
        <div style="position: relative;">
          <input type="{{ passwordFieldType }}" value="{{ password }}" onChange="{{ onPasswordChange }}" placeholder="••••••••" required="{{ true }}" style="width: 100%; background: #181818; border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 15px 46px 15px 18px; color: #F3F3F3; font-size: 15px; outline: none; transition: border-color 0.25s ease;" style-focus="border-color: rgba(243,243,243,0.5);"/>
          <button type="button" onClick="{{ togglePasswordVisibility }}" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #A8A8A8; cursor: pointer; display: flex; padding: 4px;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <sc-if value="{{ isSignup }}" hint-placeholder-val="{{ false }}">
        <div style="margin-bottom: 18px;">
          <label style="display: block; font-size: 12px; color: #A8A8A8; margin-bottom: 8px;">تکرار رمز عبور</label>
          <input type="password" value="{{ confirmPassword }}" onChange="{{ onConfirmChange }}" placeholder="••••••••" required="{{ true }}" style="width: 100%; background: #181818; border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 15px 18px; color: #F3F3F3; font-size: 15px; outline: none; transition: border-color 0.25s ease;" style-focus="border-color: rgba(243,243,243,0.5);"/>
        </div>
      </sc-if>

      <sc-if value="{{ isNotSignup }}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px;">
          <label style="display: flex; align-items: center; gap: 9px; font-size: 13px; color: #A8A8A8; cursor: pointer;">
            <input type="checkbox" checked="{{ remember }}" onChange="{{ onRememberChange }}" style="width: 16px; height: 16px; accent-color: #F3F3F3; cursor: pointer;"/>
            مرا به خاطر بسپار
          </label>
          <a href="#" style="font-size: 13px; color: #A8A8A8; text-decoration: underline;">رمز عبور را فراموش کرده‌اید؟</a>
        </div>
      </sc-if>

      <sc-if value="{{ isSignup }}" hint-placeholder-val="{{ false }}">
        <p style="font-size: 12px; color: #A8A8A8; line-height: 1.8; margin: 0 0 28px;">با ساخت حساب کاربری، شرایط استفاده و حریم خصوصی را می‌پذیرید.</p>
      </sc-if>

      <button type="submit" style="width: 100%; background: #F3F3F3; color: #090909; border: none; border-radius: 999px; padding: 17px; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 24px; transition: transform 0.3s ease, box-shadow 0.3s ease;" style-hover="transform: scale(1.02); box-shadow: 0 8px 30px rgba(243,243,243,0.18);">{{ submitLabel }}</button>
    </form>

    <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 24px;">
      <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.1);"></div>
      <span style="font-size: 12px; color: #5a5a5a;">یا</span>
      <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.1);"></div>
    </div>

    <button onClick="{{ onGoogleClick }}" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px; background: transparent; border: 1px solid rgba(255,255,255,0.18); border-radius: 999px; padding: 15px; color: #F3F3F3; font-size: 14px; cursor: pointer; margin-bottom: 28px; transition: background 0.25s ease, border-color 0.25s ease;" style-hover="background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.35);">
      <svg width="17" height="17" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.3-1.7 3.8-5.5 3.8-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.9 1.5l2.6-2.6C17 2.9 14.7 2 12 2 6.9 2 2.8 6.1 2.8 11.2S6.9 20.4 12 20.4c6.9 0 9.4-4.9 9.4-7.4 0-.5 0-.9-.1-1.3H12z"></path></svg>
      ورود با گوگل
    </button>

    <p style="text-align: center; font-size: 13px; color: #A8A8A8; margin: 0;">
      {{ switchPrompt }}
      <button type="button" onClick="{{ onSwitchMode }}" style="background: none; border: none; color: #F3F3F3; font-size: 13px; text-decoration: underline; cursor: pointer; padding: 0;">{{ switchAction }}</button>
    </p>
  </div>

  <sc-if value="{{ toastVisible }}" hint-placeholder-val="{{ false }}">
    <div style="position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%); background: #F3F3F3; color: #090909; padding: 14px 28px; border-radius: 999px; font-size: 14px; z-index: 3000; box-shadow: 0 12px 40px rgba(0,0,0,0.4); white-space: nowrap;">{{ toastMessage }}</div>
  </sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 900, &quot;height&quot;: 900}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      mode: 'signin',
      email: '',
      password: '',
      confirmPassword: '',
      remember: false,
      showPassword: false,
      toastMessage: '',
      toastVisible: false,
    };
    this.onEmailChange = this.onEmailChange.bind(this);
    this.onPasswordChange = this.onPasswordChange.bind(this);
    this.onConfirmChange = this.onConfirmChange.bind(this);
    this.onRememberChange = this.onRememberChange.bind(this);
    this.togglePasswordVisibility = this.togglePasswordVisibility.bind(this);
    this.onSubmit = this.onSubmit.bind(this);
    this.onGoogleClick = this.onGoogleClick.bind(this);
    this.onSwitchMode = this.onSwitchMode.bind(this);
  }

  componentWillUnmount() {
    if (this._toastTimer) clearTimeout(this._toastTimer);
  }

  onEmailChange(e) { this.setState({ email: e.target.value }); }
  onPasswordChange(e) { this.setState({ password: e.target.value }); }
  onConfirmChange(e) { this.setState({ confirmPassword: e.target.value }); }
  onRememberChange(e) { this.setState({ remember: e.target.checked }); }
  togglePasswordVisibility() { this.setState((s) => ({ showPassword: !s.showPassword })); }

  onSubmit(e) {
    e.preventDefault();
    this._showToast(this.state.mode === 'signup' ? 'حساب ساخته شد. به آداجیو خوش اومدی.' : 'وارد شدی. خوش برگشتی.');
  }

  onGoogleClick() { this._showToast('در حال ورود با گوگل…'); }

  onSwitchMode() {
    this.setState((s) => ({ mode: s.mode === 'signin' ? 'signup' : 'signin' }));
  }

  _showToast(message) {
    if (this._toastTimer) clearTimeout(this._toastTimer);
    this.setState({ toastMessage: message, toastVisible: true });
    this._toastTimer = setTimeout(() => this.setState({ toastVisible: false }), 2400);
  }

  renderVals() {
    const { mode, email, password, confirmPassword, remember, showPassword, toastMessage, toastVisible } = this.state;
    const isSignup = mode === 'signup';
    return {
      headline: isSignup ? 'ساخت حساب کاربری' : 'خوش برگشتی',
      isSignup, isNotSignup: !isSignup,
      email, onEmailChange: this.onEmailChange,
      password, onPasswordChange: this.onPasswordChange,
      confirmPassword, onConfirmChange: this.onConfirmChange,
      passwordFieldType: showPassword ? 'text' : 'password',
      togglePasswordVisibility: this.togglePasswordVisibility,
      remember, onRememberChange: this.onRememberChange,
      submitLabel: isSignup ? 'ساخت حساب' : 'ورود',
      onSubmit: this.onSubmit,
      onGoogleClick: this.onGoogleClick,
      switchPrompt: isSignup ? 'قبلاً ثبت‌نام کرده‌ای؟ ' : 'حساب کاربری نداری؟ ',
      switchAction: isSignup ? 'وارد شو' : 'بساز',
      onSwitchMode: this.onSwitchMode,
      toastMessage, toastVisible,
    };
  }
}
</script>
</body>
</html>
